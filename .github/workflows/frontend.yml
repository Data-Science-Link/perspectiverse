name: Frontend

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Category helper
        run: node scripts/check_categories.mjs

      - name: Planet order helper
        run: node scripts/check_planets.mjs

      - name: Build
        run: npm run build

      - name: Check built data.json contract
        run: node scripts/check_data_contract.mjs
