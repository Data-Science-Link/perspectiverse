name: Deploy GitHub Pages

on:
  push:
    branches: [main, data-snapshot]
  workflow_dispatch:
  # Pushes to data-snapshot use GITHUB_TOKEN, which does not start push workflows.
  # workflow_run still runs after Daily Discourse Pipeline (schedule, push, or workflow_dispatch).
  workflow_run:
    workflows: ["Daily Discourse Pipeline"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pipeline_publish_gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Skip deploy when pipeline did not push data-snapshot
        id: gate
        env:
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
            echo "No data-snapshot branch; skip Pages deploy for this pipeline run"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth 1 origin data-snapshot
          commit_epoch=$(git log -1 --format=%ct origin/data-snapshot)
          run_epoch=$(date -u -d "$RUN_STARTED_AT" +%s)
          if [ "$commit_epoch" -ge "$run_epoch" ]; then
            echo "data-snapshot updated during this pipeline run; deploy"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new data-snapshot commit since pipeline run started (schedule guard no-op); skip deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: pipeline_publish_gate
    # workflow_run: deploy only when the pipeline succeeded and pushed a new snapshot.
    # push and workflow_dispatch on this workflow are unchanged.
    if: >-
      ${{
        always() &&
        (
          github.event_name != 'workflow_run' ||
          (
            github.event.workflow_run.conclusion == 'success' &&
            needs.pipeline_publish_gate.outputs.should_deploy == 'true'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      # No ref: for workflow_run, GITHUB_REF and GITHUB_SHA are the default branch (main),
      # not the pipeline head. Do not set ref to github.event.workflow_run.head_sha.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Overlay data snapshot
        run: |
          if git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
            git fetch --depth 1 origin data-snapshot
            git checkout FETCH_HEAD -- public/data.json
            echo "Using public/data.json from data-snapshot"
          else
            echo "No data-snapshot branch yet; using the committed live data.json"
          fi

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
