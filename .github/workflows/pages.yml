name: Deploy GitHub Pages

on:
  push:
    branches: [main, data-snapshot]
  workflow_dispatch:
  # Pushes to data-snapshot use GITHUB_TOKEN, which does not start push workflows.
  # workflow_run still runs after Daily Discourse Pipeline (schedule, push, or workflow_dispatch).
  workflow_run:
    workflows: ["Daily Discourse Pipeline"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run fires for every conclusion. Deploy only after a successful pipeline.
    # push and workflow_dispatch are unchanged. deploy needs this job, so a skip here skips deploy.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # No ref: for workflow_run, GITHUB_REF and GITHUB_SHA are the default branch (main),
      # not the pipeline head. Do not set ref to github.event.workflow_run.head_sha.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Overlay data snapshot
        run: |
          if git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
            git fetch --depth 1 origin data-snapshot
            git checkout FETCH_HEAD -- public/data.json
            echo "Using public/data.json from data-snapshot"
          else
            echo "No data-snapshot branch yet; using the committed live data.json"
          fi

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
