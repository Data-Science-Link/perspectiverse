name: Daily Discourse Pipeline

on:
  schedule:
    # Once per day. This runs the live path, not the demo writer.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline
        run: |
          uv venv
          # Lexical clustering does not import BERTopic. Skip torch on the runner.
          uv pip install -e . --no-deps
          uv pip install pyyaml "numpy>=1.24,<2"

      - name: Run live pipeline
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
        run: |
          source .venv/bin/activate
          python -m pipeline.run_pipeline --live

      - name: Upload data.json
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: data-json
          path: public/data.json
          retention-days: 14

      - name: Publish data-snapshot branch
        if: success()
        run: |
          cp public/data.json /tmp/perspectiverse-data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
            git fetch origin data-snapshot
            git checkout -B data-snapshot origin/data-snapshot
          else
            git checkout -B data-snapshot
          fi
          cp /tmp/perspectiverse-data.json public/data.json
          git add public/data.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "Update discourse snapshot"
          git push origin data-snapshot
