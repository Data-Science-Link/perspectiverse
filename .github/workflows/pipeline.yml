name: Daily Discourse Pipeline

on:
  schedule:
    # Staggered UTC slots (#96): GitHub often creates scheduled runs 5–7h after the
    # cron time under load (docs + actions/runner#4468). All slots share the schedule
    # guard so the first run that actually starts does the work; later ones no-op.
    # No cron before 06:17 UTC — an on-time early run could lock a thin UTC day in
    # live.py (fetched_days). At 5–7h delay the first created run lands ~11–13 UTC
    # (6–8 AM CT), before the 10 AM CT product deadline; on-time 06:17 matches today.
    - cron: "17 6 * * *"
    - cron: "47 7 * * *"
    - cron: "17 9 * * *"
    - cron: "47 10 * * *"
    - cron: "17 12 * * *"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pipeline.yml"
      - "!pipeline/README.md"
      - "!pipeline/data/**"
  workflow_dispatch:

concurrency:
  group: discourse-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip scheduled run when pipeline already succeeded today (UTC)
        if: github.event_name == 'schedule'
        id: schedule_guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pipeline.schedule_guard

      - name: Scheduled run skipped (already succeeded today)
        if: github.event_name == 'schedule' && steps.schedule_guard.outputs.skip == 'true'
        run: echo "Daily Discourse Pipeline already succeeded today (UTC); no work to do."

      - name: Restore retained corpus from git
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true'
        run: |
          mkdir -p pipeline/data
          if git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
            git fetch origin data-snapshot
            git checkout origin/data-snapshot -- pipeline/data/live_corpus.db || true
          fi
          if [ ! -f pipeline/data/live_corpus.db ]; then
            echo "No snapshot corpus yet; using the committed live_corpus.db if present"
          fi

      - name: Install uv
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true'
        run: |
          uv venv
          # MiniLM embeddings are ONNX (fastembed). Skip torch and BERTopic.
          # atproto is required for BLUESKY_HANDLE / BLUESKY_APP_PASSWORD search.
          uv pip install -e . --no-deps
          uv pip install pyyaml "numpy>=1.24,<2" atproto fastembed

      - name: Download corpus from R2
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true'
        id: r2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          source .venv/bin/activate
          # downloaded: R2 is the corpus. absent: first run, keep the git seed.
          # unconfigured: secrets are empty, keep the git seed and commit it back.
          # Any other R2 error fails this step so the seed is not uploaded later.
          status=$(python -m pipeline.r2 restore pipeline/data/live_corpus.db)
          echo "$status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Run live pipeline
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true'
        id: live
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MODEL: ${{ secrets.JEV_MODEL }}
        run: |
          source .venv/bin/activate
          python -m pipeline.run_pipeline --live --db pipeline/data/live_corpus.db

      - name: Upload corpus to R2
        id: r2upload
        if: (github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true') && steps.live.outcome == 'success'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          source .venv/bin/activate
          # integrity_check runs before the PUT. A non-zero pipeline step never
          # reaches here, and a dropped upload does not replace the last object.
          python -m pipeline.r2 upload pipeline/data/live_corpus.db

      - name: Upload data.json
        if: (github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true') && steps.live.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: data-json
          path: |
            public/data.json
            pipeline/data/live_corpus.db
          retention-days: 14

      - name: Publish data-snapshot branch
        if: (github.event_name != 'schedule' || steps.schedule_guard.outputs.skip != 'true') && steps.live.outcome == 'success' && steps.r2upload.outcome == 'success'
        run: |
          mkdir -p /tmp/perspectiverse-snapshot
          cp public/data.json /tmp/perspectiverse-snapshot/data.json
          cp pipeline/data/live_corpus.db /tmp/perspectiverse-snapshot/live_corpus.db
          # cost_run.json is gitignored. Copy it before reset so the ledger
          # step still has this run if the worktree is discarded.
          if [ -f pipeline/data/cost_run.json ]; then
            cp pipeline/data/cost_run.json /tmp/perspectiverse-snapshot/cost_run.json
          fi
          # r2_usage.json is gitignored and written by restore plus upload,
          # which are separate processes from the live step.
          if [ -f pipeline/data/r2_usage.json ]; then
            cp pipeline/data/r2_usage.json /tmp/perspectiverse-snapshot/r2_usage.json
          fi
          # Build the ledger with THIS commit's pipeline.costs, before checkout
          # switches the worktree onto data-snapshot (that branch does not carry
          # the pipeline code). Read the existing ledger first and append.
          # A failure here warns and still publishes data.json. costs/ is not
          # under public/, so Pages does not deploy it. Nothing is committed
          # to main.
          COST_READY=0
          if [ -f /tmp/perspectiverse-snapshot/cost_run.json ]; then
            mkdir -p /tmp/perspectiverse-snapshot/costs
            LEDGER=/tmp/perspectiverse-snapshot/costs/ledger.csv
            README=/tmp/perspectiverse-snapshot/costs/README.md
            SKIP_COSTS=0
            if git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
              if git fetch origin data-snapshot; then
                if git cat-file -e origin/data-snapshot:costs/ledger.csv 2>/dev/null; then
                  if ! git show origin/data-snapshot:costs/ledger.csv > "$LEDGER"; then
                    echo "::warning::Could not read costs/ledger.csv from data-snapshot; leaving the ledger unchanged"
                    rm -f "$LEDGER"
                    SKIP_COSTS=1
                  fi
                fi
              else
                echo "::warning::Could not fetch data-snapshot; leaving the cost ledger unchanged"
                SKIP_COSTS=1
              fi
            fi
            if [ "$SKIP_COSTS" = "0" ]; then
              R2_USAGE_ARG=""
              if [ -f /tmp/perspectiverse-snapshot/r2_usage.json ]; then
                R2_USAGE_ARG="--r2-usage /tmp/perspectiverse-snapshot/r2_usage.json"
              fi
              if source .venv/bin/activate && python -m pipeline.costs append --run /tmp/perspectiverse-snapshot/cost_run.json --ledger "$LEDGER" --readme "$README" $R2_USAGE_ARG; then
                :
              else
                echo "::warning::Cost ledger update failed; publishing any cost files that were written. The discourse snapshot will still publish"
              fi
              # A chart-only failure must not drop the ledger or the table.
              COST_READY=1
            fi
          else
            echo "::warning::No cost run file; leaving the cost ledger unchanged"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The live step dirties data.json and live_corpus.db. Those bytes are
          # already in /tmp. Discard the worktree or checkout refuses to switch
          # onto data-snapshot (run 36664060030, exit 1, ~0s).
          git reset --hard HEAD
          if git ls-remote --exit-code --heads origin data-snapshot >/dev/null 2>&1; then
            git fetch origin data-snapshot
            git checkout --force -B data-snapshot origin/data-snapshot
          else
            git checkout --force -B data-snapshot
          fi
          mkdir -p pipeline/data
          cp /tmp/perspectiverse-snapshot/data.json public/data.json
          # Pages publishes data.json. Once R2 is configured, stop committing
          # the SQLite file so the blob cannot grow toward GitHub's 100 MB limit.
          if [ "${{ steps.r2.outputs.status }}" = "unconfigured" ]; then
            cp /tmp/perspectiverse-snapshot/live_corpus.db pipeline/data/live_corpus.db
            git add public/data.json pipeline/data/live_corpus.db
          elif [ "${{ steps.r2.outputs.status }}" = "downloaded" ] || [ "${{ steps.r2.outputs.status }}" = "absent" ]; then
            git add public/data.json
            git rm -f --ignore-unmatch pipeline/data/live_corpus.db
          else
            echo "Unexpected R2 restore status"
            exit 1
          fi
          # Overlay the appended ledger. The checkout already has the previous
          # costs/ files; this replaces them with previous rows plus this run.
          if [ "$COST_READY" = "1" ]; then
            mkdir -p costs
            if [ -f /tmp/perspectiverse-snapshot/costs/ledger.csv ]; then
              cp /tmp/perspectiverse-snapshot/costs/ledger.csv costs/ledger.csv
              git add -- costs/ledger.csv
            fi
            if [ -f /tmp/perspectiverse-snapshot/costs/README.md ]; then
              cp /tmp/perspectiverse-snapshot/costs/README.md costs/README.md
              git add -- costs/README.md
            fi
            if [ -f /tmp/perspectiverse-snapshot/costs/daily_spend_14d.svg ]; then
              cp /tmp/perspectiverse-snapshot/costs/daily_spend_14d.svg costs/daily_spend_14d.svg
              git add -- costs/daily_spend_14d.svg
            fi
          fi
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git commit -m "Update discourse snapshot and cost ledger"
          git push origin data-snapshot
