# Copy to pipeline/config/pipeline.yaml to override locally (gitignored).
# Public claims kept in the rolling window. Non-claims are discarded after Jev
# classification and never stored. Each morning adds ~1/7 of this count and
# retire_oldest evicts the oldest claims until the total is back at this ceiling.
window_hours: 168
refresh_hours: 24
sample_size: 10000

# Smallest group that can be a planet. Tuned on the 10K corpus: 5 puts most
# posts that sit near a center into a group; 8 leaves just under half. The
# live job does not raise this with the claim count. Groups under the floor
# stay unlabeled. catalog_size is a ceiling, not a quota.
min_cluster_size: 5

# embedding: local MiniLM via fastembed, no torch. lexical: TF-IDF for tests.
# bertopic: all-MiniLM-L6-v2 when that extra stack is installed.
# catalog_size is how many of the tight groups to publish, largest first.
# Clustering may find many more. The rest stay out of the planets.
cluster_backend: embedding
embedding_model: all-MiniLM-L6-v2

# auto tries Ollama, then an OpenAI-compatible API, then a heuristic name.
# Set OPENAI_BASE_URL to https://api.deepinfra.com/v1/openai and OPENAI_API_KEY
# to a DeepInfra token. OPENAI_MODEL then defaults to Llama 3.3 70B Turbo.
# heuristic skips the network and names faces from top terms + extractive posts.
label_backend: auto
ollama_model: llama3.2
openai_model: gpt-4o-mini

# Planets labeled concurrently when a network label backend is on (the labeling
# loop is I/O bound). The heuristic backend always runs one at a time.
# Section solar systems share one pool: the default 8 is run as 12 calls in
# flight across every section. Any other value is the cap for both.
label_workers: 8
# Minutes the per-section solar systems may spend after the global system is
# built. 0 skips sections. Omitting the key uses the default (20). Sections
# past the ceiling are skipped (logged) so the snapshot publishes.
section_budget_minutes: 20
# cluster_once: one density pass. Each planet is listed in the section Jev
# picks from its summary and arguments, and in a second section when Jev's
# top two are close. Labels are written once and reused in the global list
# and every section list. A section with fewer than catalog_size published
# planets is clustered on its own to fill the gaps.
# per_section: cluster each section again and label those planets separately.
section_grouping: cluster_once
# jev asks one section question per labeled planet. majority uses the section
# with the most member posts (both sections at or above 35%). A missing key
# or a failed call uses majority for that planet.
section_assignment: jev

representative_posts: 36
# MMR cap for face labeling prompts (title, summary, arguments).
prompt_sample_size: 40
# Face labeling during k-retry / forced-cut / story split (final publish pass uses prompt_sample_size).
draft_prompt_sample_size: 12
# Diverse slice for planet / topic naming prompts (not oldest members).
planet_prompt_sample_size: 20
language: en
seed: 0
catalog_size: 10
# A planet needs at least this many posts to be published. The check runs
# before face labels, names, and briefs, for split stories and for a whole
# candidate. Pieces under the floor are not glued onto a sibling and do not
# fill a catalog slot. 0 disables the floor.
min_planet_posts: 5

# Content-neutral search tokens. Bluesky search has no random-post endpoint.
# These words do not steer the week toward a beat. --query still overrides them.
neutral_queries:
  - the
  - and
  - to
  - of
  - in
  - for
