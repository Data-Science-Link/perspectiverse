# Copy to pipeline/config/pipeline.yaml to override locally (gitignored).
# The daily job holds up to 10,000 posts that already passed cleaning, dedup,
# spam, and the public-claim check. Non-claims stay stored and do not count.
window_hours: 168
refresh_hours: 24
sample_size: 10000

# Floor for a small window. The live job raises this with the claim count
# (max of this value and claims // 200, about 50 at 10,000 claims). Groups
# under the floor stay unlabeled. catalog_size is a ceiling, not a quota.
min_cluster_size: 8

# embedding: local MiniLM via fastembed, no torch. lexical: TF-IDF for tests.
# bertopic: all-MiniLM-L6-v2 when that extra stack is installed.
# catalog_size is how many of the tight groups to publish, largest first.
# Clustering may find many more. The rest stay out of the planets.
cluster_backend: embedding
embedding_model: all-MiniLM-L6-v2

# auto tries Ollama, then an OpenAI-compatible API, then a heuristic name.
# Set OPENAI_BASE_URL to https://api.deepinfra.com/v1/openai and OPENAI_API_KEY
# to a DeepInfra token. OPENAI_MODEL then defaults to Llama 3.3 70B Turbo.
# heuristic skips the network and names faces from top terms + extractive posts.
label_backend: auto
ollama_model: llama3.2
openai_model: gpt-4o-mini

representative_posts: 36
language: en
seed: 0
catalog_size: 10

# Content-neutral search tokens. Bluesky search has no random-post endpoint.
# These words do not steer the week toward a beat. --query still overrides them.
neutral_queries:
  - the
  - and
  - to
  - of
  - in
  - for
