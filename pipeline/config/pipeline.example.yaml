# Copy to pipeline/config/pipeline.yaml to override locally (gitignored).
# First rendition: 1000 non-spam posts in a retained SQLite window.
window_hours: 168
refresh_hours: 24
sample_size: 1000
refresh_fraction: 0.1429
min_group_posts: 10

# Clusters smaller than this become Topic -1. 8 is the floor for a 1000-post
# window so tiny clumps do not become planets. The clusterer will split large
# groups if it cannot mint 10 planets.
min_cluster_size: 8

# lexical: numpy TF-IDF, no model download. bertopic: all-MiniLM-L6-v2 via BERTopic.
cluster_backend: lexical
embedding_model: all-MiniLM-L6-v2

# auto tries Ollama, then an OpenAI-compatible API, then a heuristic name.
# Set OPENAI_BASE_URL to https://api.deepinfra.com/v1/openai and OPENAI_API_KEY
# to a DeepInfra token. OPENAI_MODEL then defaults to Llama 3.3 70B Turbo.
# heuristic skips the network and names faces from top terms + extractive posts.
label_backend: auto
ollama_model: llama3.2
openai_model: gpt-4o-mini

representative_posts: 12
language: en
seed: 0
catalog_size: 10

# Seeded so Sports / Geopolitics / AI each have at least 10 quality posts.
# Remaining quota is a general English sample for the unsupervised top 10.
group_quotas:
  general: 400
  sports: 200
  geopolitics: 200
  ai: 200

query_groups:
  general:
    - news
    - breaking
    - reported
    - according
    - analysis
  sports:
    - nfl
    - nba
    - soccer
    - premier league
    - world series
    - mlb
    - tennis
    - olympics
  geopolitics:
    - ukraine
    - gaza
    - election
    - china
    - nato
    - israel
    - taiwan
    - iran
  ai:
    - chatgpt
    - openai
    - artificial intelligence
    - llm
    - machine learning
    - anthropic
    - copilot

# Flat fallback if query_groups is removed.
queries:
  - the
  - people
  - today
  - because
  - news
