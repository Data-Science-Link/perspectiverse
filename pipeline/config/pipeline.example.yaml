# Copy to pipeline/config/pipeline.yaml to override locally (gitignored).
# Public claims kept in the rolling window. Non-claims are not stored as posts.
# Their Jev verdicts stay in the corpus database for 14 days so the same URI
# is not scored twice. Each morning adds ~1/7 of this count and retire_oldest
# evicts the oldest claims until the total is back at this ceiling.
window_hours: 168
refresh_hours: 24
sample_size: 100000

# Smallest group that can be a planet. Tuned on the 10K corpus: 5 puts most
# posts that sit near a center into a group; 8 leaves just under half. The
# live job does not raise this with the claim count. Groups under the floor
# stay unlabeled. catalog_size is a ceiling, not a quota.
min_cluster_size: 5

# embedding: local MiniLM via fastembed, no torch. lexical: TF-IDF for tests.
# bertopic: all-MiniLM-L6-v2 when that extra stack is installed.
# catalog_size is how many of the tight groups to publish, largest first.
# Clustering may find many more. The rest stay out of the planets.
cluster_backend: embedding
embedding_model: all-MiniLM-L6-v2

# auto tries Ollama, then an OpenAI-compatible API, then a heuristic name.
# Set OPENAI_BASE_URL to https://api.deepinfra.com/v1/openai and OPENAI_API_KEY
# to a DeepInfra token. OPENAI_MODEL then defaults to Llama 3.3 70B Turbo.
# heuristic skips the network and names faces from top terms + extractive posts.
label_backend: auto
ollama_model: llama3.2
openai_model: gpt-4o-mini

# Planets labeled concurrently when a network label backend is on (the labeling
# loop is I/O bound). The heuristic backend always runs one at a time.
# Section solar systems share one pool: the default 8 is run as 12 calls in
# flight across every section. Any other value is the cap for both.
label_workers: 8
# Minutes the per-section solar systems may spend after the global system is
# built. 0 skips sections. Omitting the key uses the default (30). A free
# slot goes to the section with the fewest planets in flight, so a large
# section cannot spend the window before the others start. The last 6
# minutes are kept for the wide face relabel. Sections past the ceiling are
# skipped (logged) so the snapshot publishes.
section_budget_minutes: 30

representative_posts: 36
# MMR cap for face labeling prompts (title, summary, arguments).
prompt_sample_size: 40
# Face labeling during k-retry / forced-cut / story split (final publish pass uses prompt_sample_size).
draft_prompt_sample_size: 12
# Diverse slice for planet / topic naming prompts (not oldest members).
planet_prompt_sample_size: 20
language: en
seed: 0
catalog_size: 10
# A planet needs at least this many posts to be published. The check runs
# before face labels, names, and briefs, for split stories and for a whole
# candidate. Pieces under the floor are not glued onto a sibling and do not
# fill a catalog slot. 0 disables the floor.
min_planet_posts: 30
# Share of the stance sample that a second coherent pole must reach before a
# one-face planet is split. Every planet is sampled at most 40 posts. The
# whole planet is used when it is smaller than that cap. One value. Michael
# set this at 10% on 2026-10-11 (DECISIONS.md). The check does not use the
# whole-planet count.
stance_second_face_share: 0.10

# Content-neutral search tokens. Bluesky search has no random-post endpoint.
# These words do not steer the week toward a beat. --query still overrides them.
neutral_queries:
  - the
  - and
  - to
  - of
  - in
  - for

# Phase 3: about 25 posts per Jev request, spam and claim only.
# The section question stays on the per-post call until #90.
# The shadow test failed batched claims, so this stays false.
jev_batch: false

# Production default. The spam guard replaces per-post Jev. Every non-spam
# post is stored. Jev is one newspaper-category call per candidate planet.
# Search uses the wide query list across the last 7 UTC days, toward 14,300
# non-spam posts a day, and backs off on rate limits. The daily workflow also
# sets PERSPECTIVERSE_FREE_INGEST=1, except legacy_jev=true or a fill dispatch,
# which set it to 0 and take the old per-post path.
free_ingest: true

# Private planet and perspective briefings in R2 (dossiers/<edition>/<planet-id>.md).
# Off: the grounded summary, brief, and detail stay as they are, and nothing
# is written under dossiers/. On, rebuilds spend at most the dossier allowance
# or whatever is left under the $1/day hard stop after a reserve, whichever
# is smaller. The allowance defaults to $0.09 so a typical $0.16 night stays
# on the #87 $0.25 total. A $0.25 dossier allowance does not fit that bar.
# PERSPECTIVERSE_DOSSIER_BUDGET_USD overrides the allowance.
# PERSPECTIVERSE_DOSSIERS=1 turns it on for one run. Leave this false.
dossiers: false
# dossier_budget_usd: 0.09
